<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Nights — an open-world crime story in Solmar City</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #10141c;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #1c2438 0%, #10141c 100%);
  }
  canvas {
    display: block;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    background: #b8a06a;
    image-rendering: auto;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
  }
  #fallback {
    display: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<div id="fallback">Vice City Nights — keyboard &amp; mouse · WASD move/drive · E enter cars · P pause</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
